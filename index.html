<script>
        const CONFIG = {
            modelScale: "0.0035 0.0035 0.0035", 
            modelPosition: "0 0 0",        
            modelRotation: "-35 0 0",      
            logoPosition: "0 3.2 0.3",     
            logoRotation: "-35 0 0",       // Inclina los logos hacia arriba igual que la bandera
            logoWidth: 3.5,                
            logoHeight: 1.75                
        };

        document.addEventListener("DOMContentLoaded", () => {
            const marker = document.getElementById('marker');
            const scanOverlay = document.getElementById('scanning-overlay');
            const activeModel = document.getElementById('activeModel');
            const brandLogo = document.getElementById('brandLogo');
            const bgMusic = document.getElementById('bgMusic');
            const audioBtn = document.getElementById('audio-btn');
            const captureBtn = document.getElementById('capture-btn');
            const rewardModal = document.getElementById('reward-modal');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const rewardDescription = document.getElementById('reward-description');
            const couponCode = document.getElementById('coupon-code');
            const timerEl = document.getElementById('timer');
            const sceneEl = document.querySelector('a-scene');

            let isSpinning = false;

            if (activeModel) {
                activeModel.setAttribute('scale', CONFIG.modelScale);
                activeModel.setAttribute('position', CONFIG.modelPosition);
                activeModel.setAttribute('rotation', CONFIG.modelRotation);
            }

            if (brandLogo) {
                brandLogo.setAttribute('position', CONFIG.logoPosition);
                brandLogo.setAttribute('rotation', CONFIG.logoRotation);
                brandLogo.setAttribute('width', CONFIG.logoWidth);
                brandLogo.setAttribute('height', CONFIG.logoHeight);
            }

            marker.addEventListener("markerFound", () => {
                scanOverlay.style.opacity = '0';
            });

            marker.addEventListener("markerLost", () => {
                scanOverlay.style.opacity = '1';
            });

            // Resto del script de captura y gamificación...
        });
    </script>
