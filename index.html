<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blackcat WebAR Experience - 3TECHLAB</title>

    <!-- Dependencias estables: A-Frame + AR.js + Animaciones -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: fixed !important;
            background-color: #000;
        }

        video, canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            margin: 0 !important;
        }

        .a-enter-vr {
            display: none !important;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            margin-top: 10px;
        }

        .controls-container {
            pointer-events: auto;
            margin-bottom: 25px;
        }

        .btn-capture {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #scanning-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.85);
            padding: 12px 24px;
            border-radius: 12px;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="brand-header">BLACKCAT • BEBIDAS & COCKTAILS</div>
        <div id="scanning-overlay">Apunta la cámara al marcador...</div>
        <div class="controls-container">
            <button id="capture-btn" class="btn-capture">📷 Capturar Momento</button>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <!-- RECURSO GENÉRICO DE PRUEBAS 3D -->
            <a-asset-item id="genericModel" src="./Model_3D.glb"></a-asset-item>
            <img id="logoImg" src="./blackcat_logo.png">
        </a-assets>

        <!-- Iluminación de ambiente y acento para la barra -->
        <a-light type="ambient" color="#ffffff" intensity="2.0"></a-light>
        <a-light type="directional" color="#ffaa00" intensity="2.5" position="2 4 2"></a-light>

        <a-marker preset="hiro" id="marker">
            
            <!-- LOGO BLACKCAT (Ajustable) -->
            <a-plane 
                id="brandLogo"
                src="#logoImg" 
                position="0 1.2 -0.2" 
                height="1.2" 
                width="2.4" 
                material="transparent: true; side: double">
            </a-plane>

            <!-- MODELO 3D GENÉRICO (Ajustable desde JS) -->
            <a-gltf-model 
                id="activeModel"
                src="#genericModel" 
                position="0 0 0" 
                scale="1 1 1"
                rotation="0 0 0"
                animation-mixer>
            </a-gltf-model>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // =================================================================
        // 🎛️ PANEL DE CONTROL DE PRUEBAS RÁPIDAS (3TECHLAB)
        // Editá estos valores según el modelo que estés probando:
        // =================================================================
        const CONFIG = {
            modelScale: "0.05 0.05 0.05", // Cambiá si el modelo es gigante o chiquito
            modelPosition: "0 0 0",       // X Y Z para centrarlo sobre el marcador
            logoPosition: "0 1.5 -0.2",   // Ubicación del logo respecto al modelo
            logoWidth: 2.4,               // Ancho del logo
            logoHeight: 1.2               // Alto del logo
        };

        document.addEventListener("DOMContentLoaded", () => {
            const marker = document.getElementById('marker');
            const scanOverlay = document.getElementById('scanning-overlay');
            const activeModel = document.getElementById('activeModel');
            const brandLogo = document.getElementById('brandLogo');

            // Aplicar configuración inicial
            if (activeModel) {
                activeModel.setAttribute('scale', CONFIG.modelScale);
                activeModel.setAttribute('position', CONFIG.modelPosition);
            }
            if (brandLogo) {
                brandLogo.setAttribute('position', CONFIG.logoPosition);
                brandLogo.setAttribute('width', CONFIG.logoWidth);
                brandLogo.setAttribute('height', CONFIG.logoHeight);
            }

            marker.addEventListener("markerFound", () => {
                scanOverlay.style.opacity = '0';
            });

            marker.addEventListener("markerLost", () => {
                scanOverlay.style.opacity = '1';
            });

            // Captura de Pantalla
            document.getElementById('capture-btn').addEventListener('click', () => {
                const video = document.querySelector('video');
                const canvas = document.querySelector('canvas.a-canvas');

                if (!video || !canvas) return;

                const mergedCanvas = document.createElement('canvas');
                mergedCanvas.width = canvas.width;
                mergedCanvas.height = canvas.height;
                const ctx = mergedCanvas.getContext('2d');

                ctx.drawImage(video, 0, 0, mergedCanvas.width, mergedCanvas.height);
                ctx.drawImage(canvas, 0, 0, mergedCanvas.width, mergedCanvas.height);

                const link = document.createElement('a');
                link.download = `Blackcat_AR_${Date.now()}.png`;
                link.href = mergedCanvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
