<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blackcat WebAR Experience - 3TECHLAB</title>

    <!-- CDNs Estables A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: fixed !important;
            background-color: #000;
        }

        video, canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            margin: 0 !important;
        }

        .a-enter-vr {
            display: none !important;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            margin-top: 10px;
        }

        .controls-container {
            pointer-events: auto;
            margin-bottom: calc(85px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-capture {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-capture:active {
            transform: scale(0.95);
            background-color: #ffffff;
            color: #000000;
        }

        .btn-audio {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .btn-audio:active {
            transform: scale(0.92);
        }

        .btn-audio svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .btn-audio .icon-muted { display: block; }
        .btn-audio .icon-playing { display: none; }
        .btn-audio.active .icon-muted { display: none; }
        .btn-audio.active .icon-playing { display: block; }

        #scanning-overlay {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.85);
            padding: 14px 28px;
            border-radius: 14px;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        #loading-spinner {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 6;
            color: #fff;
            font-size: 0.85rem;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        AFRAME.registerComponent('hide-floor', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            if (child.material) {
                                child.material.polygonOffset = true;
                                child.material.polygonOffsetFactor = 1;
                                child.material.polygonOffsetUnits = 1;
                            }
                            if (child.name.includes('Plane') || child.name.includes('Floor') || child.name.includes('Shiny_Floor')) {
                                child.visible = false;
                            }
                        }
                    });
                });
            }
        });
    </script>
</head>
<body>

    <audio id="bgMusic" src="./blackcat_music.mp3" loop preload="auto"></audio>

    <div id="ui-overlay">
        <div class="brand-header">BLACKCAT • BEBIDAS & COCKTAILS</div>
        <div id="scanning-overlay">Apunta la cámara al vaso...</div>
        <div id="loading-spinner">
            <div class="spinner"></div>
            <span>Cargando recursos 3D...</span>
        </div>
        <div class="controls-container">
            <button id="audio-btn" class="btn-audio" aria-label="Toggle Audio">
                <svg class="icon-muted" viewBox="0 0 24 24">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
                <svg class="icon-playing" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            <button id="capture-btn" class="btn-capture">📷 Capturar</button>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; maxDetectionRate: 60; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720;"
        renderer="logarithmicDepthBuffer: true; alpha: true; precision: mediump; antialias: true;"
        vr-mode-ui="enabled: false">

        <a-assets timeout="10000">
            <a-asset-item id="genericModel" src="./Model_3D.glb"></a-asset-item>
            <img id="logoImg" src="./blackcat_logo.png">
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="2.0"></a-light>
        <a-light type="directional" color="#ffaa00" intensity="2.5" position="2 4 2"></a-light>

        <a-marker 
            type="pattern" 
            url="./blackcat_marker.patt" 
            id="marker"
            smooth="true"
            smoothCount="15"
            smoothTolerance="0.05"
            smoothThreshold="10"
            minConfidence="0.2">
            
            <a-plane 
                id="brandLogo"
                src="#logoImg" 
                material="transparent: true; side: double">
            </a-plane>

            <a-gltf-model 
                id="activeModel"
                src="#genericModel" 
                hide-floor
                animation-mixer>
            </a-gltf-model>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const CONFIG = {
            modelScale: "0.0035 0.0035 0.0035", 
            modelPosition: "0 0 0",        
            modelRotation: "0 0 0",        
            logoPosition: "0 2.4 0.6",     
            logoWidth: 3.0,                
            logoHeight: 1.5                
        };

        document.addEventListener("DOMContentLoaded", () => {
            const marker = document.getElementById('marker');
            const scanOverlay = document.getElementById('scanning-overlay');
            const loadingSpinner = document.getElementById('loading-spinner');
            const activeModel = document.getElementById('activeModel');
            const brandLogo = document.getElementById('brandLogo');
            const bgMusic = document.getElementById('bgMusic');
            const audioBtn = document.getElementById('audio-btn');
            const captureBtn = document.getElementById('capture-btn');
            const assets = document.querySelector('a-assets');

            let isModelLoaded = false;
            let isMarkerFound = false;
            let audioUnlocked = false;

            assets.addEventListener('loaded', () => {
                isModelLoaded = true;
                loadingSpinner.style.opacity = '0';
                setTimeout(() => { loadingSpinner.style.display = 'none'; }, 300);
            });

            const unlockAudio = () => {
                if (!audioUnlocked && bgMusic) {
                    bgMusic.play().then(() => {
                        audioUnlocked = true;
                        audioBtn.classList.add('active');
                    }).catch(err => console.log("Esperando interacción..."));
                }
            };

            window.addEventListener('click', unlockAudio, { once: true });
            window.addEventListener('touchstart', unlockAudio, { once: true });

            audioBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (bgMusic.paused) {
                    bgMusic.play();
                    audioBtn.classList.add('active');
                } else {
                    bgMusic.pause();
                    audioBtn.classList.remove('active');
                }
            });

            if (activeModel) {
                activeModel.setAttribute('scale', CONFIG.modelScale);
                activeModel.setAttribute('position', CONFIG.modelPosition);
                activeModel.setAttribute('rotation', CONFIG.modelRotation);
            }

            if (brandLogo) {
                brandLogo.setAttribute('position', CONFIG.logoPosition);
                brandLogo.setAttribute('width', CONFIG.logoWidth);
                brandLogo.setAttribute('height', CONFIG.logoHeight);
            }

            marker.addEventListener("markerFound", () => {
                isMarkerFound = true;
                scanOverlay.style.opacity = '0';
                unlockAudio();
            });

            marker.addEventListener("markerLost", () => {
                isMarkerFound = false;
                scanOverlay.style.opacity = '1';
            });

            // 📷 MÓDULO DE CAPTURA SOCIAL BRANDING (3TECHLAB)
            captureBtn.addEventListener('click', () => {
                const video = document.querySelector('video');
                const canvas = document.querySelector('canvas.a-canvas');

                if (!video || !canvas) return;

                // Crear lienzo de alta resolución
                const mergedCanvas = document.createElement('canvas');
                mergedCanvas.width = canvas.width;
                mergedCanvas.height = canvas.height;
                const ctx = mergedCanvas.getContext('2d');

                // 1. Dibujar Feed de Cámara Web
                ctx.drawImage(video, 0, 0, mergedCanvas.width, mergedCanvas.height);

                // 2. Dibujar Escena 3D WebGL
                ctx.drawImage(canvas, 0, 0, mergedCanvas.width, mergedCanvas.height);

                // 3. CAPA DE BRANDING DE MARCA (OVERLAY)
                const w = mergedCanvas.width;
                const h = mergedCanvas.height;

                // Gradient superior e inferior para legibilidad
                const gradTop = ctx.createLinearGradient(0, 0, 0, 120);
                gradTop.addColorStop(0, 'rgba(0,0,0,0.8)');
                gradTop.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradTop;
                ctx.fillRect(0, 0, w, 120);

                const gradBottom = ctx.createLinearGradient(0, h - 120, 0, h);
                gradBottom.addColorStop(0, 'rgba(0,0,0,0)');
                gradBottom.addColorStop(1, 'rgba(0,0,0,0.85)');
                ctx.fillStyle = gradBottom;
                ctx.fillRect(0, h - 120, w, 120);

                // Texto Superior: BLACKCAT
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.letterSpacing = '3px';
                ctx.fillText('BLACKCAT • BEBIDAS & COCKTAILS', w / 2, 50);

                // Watermark Inferior
                ctx.font = '14px sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillText('EXPERIENCIA WEBAR EN BARRA', w / 2, h - 35);

                // 4. Exportar y Descargar Imagen Brandeada
                const link = document.createElement('a');
                link.download = `Blackcat_Cocktails_${Date.now()}.png`;
                link.href = mergedCanvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
