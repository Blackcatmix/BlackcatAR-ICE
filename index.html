<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blackcat WebAR Experience - 3TECHLAB</title>

    <!-- Librerías estables vía CDN oficial (sin raw.githack que suele fallar en mobile) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: fixed !important;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        video, canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            margin: 0 !important;
        }

        .a-enter-vr { display: none !important; }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .header-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: calc(10px + env(safe-area-inset-top));
        }

        .brand-header {
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        #scanning-overlay {
            color: #fff;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .controls-container {
            pointer-events: auto;
            margin-bottom: calc(30px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-capture {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .btn-capture:active {
            transform: scale(0.95);
            background-color: #ffffff;
            color: #000000;
        }

        .btn-audio {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-audio svg { width: 24px; height: 24px; fill: #ffffff; }
        .btn-audio .icon-muted { display: none; }
        .btn-audio .icon-playing { display: block; }
        .btn-audio.muted .icon-muted { display: block; }
        .btn-audio.muted .icon-playing { display: none; }
    </style>
</head>
<body>

    <audio id="bgMusic" src="./blackcat_music.mp3" loop preload="auto"></audio>

    <div id="ui-overlay">
        <div class="header-group">
            <div class="brand-header">BLACKCAT • BEBIDAS & COCKTAILS</div>
            <div id="scanning-overlay">Iniciando cámara...</div>
        </div>

        <div class="controls-container">
            <button id="audio-btn" class="btn-audio" aria-label="Toggle Audio">
                <svg class="icon-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                <svg class="icon-playing" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <button id="capture-btn" class="btn-capture">📷 Capturar</button>
        </div>
    </div>

    <!-- Escena AR.js con inicialización explícita y fallback de cámara -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.50; maxDetectionRate: 60;"
        renderer="logarithmicDepthBuffer: true; alpha: true; precision: mediump; antialias: true; preserveDrawingBuffer: true;"
        vr-mode-ui="enabled: false">

        <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
        <a-light type="directional" color="#ffaa00" intensity="2.0" position="2 4 2"></a-light>

        <a-marker 
            type="pattern" 
            url="./blackcat_marker.patt" 
            id="marker"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.1"
            smoothThreshold="2"
            minConfidence="0.05">
            
            <a-entity id="logoGroup">
                <a-box 
                    id="logoPlate" 
                    material="color: #0d0d0d; roughness: 0.4; metalness: 0.6;">
                </a-box>

                <a-plane 
                    id="brandLogoFront" 
                    material="src: ./blackcat_logo.png; shader: flat; transparent: true; side: front;">
                </a-plane>

                <a-plane 
                    id="brandLogoBack" 
                    rotation="0 180 0" 
                    material="src: ./blackcat_logo.png; shader: flat; transparent: true; side: front;">
                </a-plane>
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const CONFIG = {
            groupPosition: "0 3.0 0.3",
            groupRotation: "-35 0 0",
            width: 3.5,
            height: 1.75,
            depth: 0.12
        };

        document.addEventListener("DOMContentLoaded", () => {
            const marker = document.getElementById('marker');
            const scanOverlay = document.getElementById('scanning-overlay');
            const logoGroup = document.getElementById('logoGroup');
            const logoPlate = document.getElementById('logoPlate');
            const brandLogoFront = document.getElementById('brandLogoFront');
            const brandLogoBack = document.getElementById('brandLogoBack');
            const bgMusic = document.getElementById('bgMusic');
            const audioBtn = document.getElementById('audio-btn');
            const captureBtn = document.getElementById('capture-btn');
            const sceneEl = document.querySelector('a-scene');

            let isAudioPlaying = true;

            // Feedback
