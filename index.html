<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blackcat WebAR Experience - 3TECHLAB</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: fixed !important;
            background-color: #000;
        }

        video, canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            margin: 0 !important;
        }

        .a-enter-vr {
            display: none !important;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            margin-top: 10px;
        }

        .controls-container {
            pointer-events: auto;
            margin-bottom: 25px;
        }

        .btn-capture {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #scanning-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.85);
            padding: 14px 28px;
            border-radius: 14px;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 6;
            color: #fff;
            font-size: 0.85rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        // Ocultar mallas secundarias de suelo
        AFRAME.registerComponent('hide-floor', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            // Corrección de artefactos gráficos/rayas (Z-fighting)
                            if (child.material) {
                                child.material.polygonOffset = true;
                                child.material.polygonOffsetFactor = 1;
                                child.material.polygonOffsetUnits = 1;
                            }
                            if (child.name.includes('Plane') || child.name.includes('Floor') || child.name.includes('Shiny_Floor')) {
                                child.visible = false;
                            }
                        }
                    });
                });
            }
        });
    </script>
</head>
<body>

    <div id="ui-overlay">
        <div class="brand-header">BLACKCAT • BEBIDAS & COCKTAILS</div>
        <div id="scanning-overlay">Apunta la cámara al marcador...</div>
        <div id="loading-spinner">
            <div class="spinner"></div>
            <span>Cargando experiencia 3D...</span>
        </div>
        <div class="controls-container">
            <button id="capture-btn" class="btn-capture">📷 Capturar Momento</button>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; maxDetectionRate: 60; canvasWidth: 640; canvasHeight: 480;"
        renderer="logarithmicDepthBuffer: true; alpha: true; precision: mediump; antialias: true;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="genericModel" src="./Model_3D.glb"></a-asset-item>
            <img id="logoImg" src="./blackcat_logo.png">
        </a-assets>

        <!-- Iluminación -->
        <a-light type="ambient" color="#ffffff" intensity="2.0"></a-light>
        <a-light type="directional" color="#ffaa00" intensity="2.5" position="2 4 2"></a-light>

        <!-- Marcador Hiro con tolerancia de inclinación y suavizado de movimiento -->
        <a-marker 
            preset="hiro" 
            id="marker"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.05"
            smoothThreshold="5"
            minConfidence="0.3">
            
            <!-- Logo Blackcat separado del cartel y más alto -->
            <a-plane 
                id="brandLogo"
                src="#logoImg" 
                material="transparent: true; side: double"
                animation__pulse="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine">
            </a-plane>

            <!-- Cartel 3D -->
            <a-gltf-model 
                id="activeModel"
                src="#genericModel" 
                hide-floor
                animation-mixer>
            </a-gltf-model>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // 🎛️ CONTROLES DE UBICACIÓN
        const CONFIG = {
            modelScale: "0.15 0.15 0.15",    
            modelPosition: "0 0 0",        
            modelRotation: "0 0 0",        
            logoPosition: "0 2.6 0.8",     // Y=2.6 (Más alto) | Z=0.8 (Más separado del cartel hacia vos)
            logoWidth: 3.2,                
            logoHeight: 1.6                
        };

        document.addEventListener("DOMContentLoaded", () => {
            const marker = document.getElementById('marker');
            const scanOverlay = document.getElementById('scanning-overlay');
            const loadingSpinner = document.getElementById('loading-spinner');
            const activeModel = document.getElementById('activeModel');
            const brandLogo = document.getElementById('brandLogo');

            let isModelLoaded = false;
            let isMarkerFound = false;

            if (activeModel) {
                activeModel.setAttribute('scale', CONFIG.modelScale);
                activeModel.setAttribute('position', CONFIG.modelPosition);
                activeModel.setAttribute('rotation', CONFIG.modelRotation);

                activeModel.addEventListener('model-loaded', () => {
                    isModelLoaded = true;
                    if (isMarkerFound) {
                        loadingSpinner.style.display = 'none';
                    }
                });
            }

            if (brandLogo) {
                brandLogo.setAttribute('position', CONFIG.logoPosition);
                brandLogo.setAttribute('width', CONFIG.logoWidth);
                brandLogo.setAttribute('height', CONFIG.logoHeight);
            }

            marker.addEventListener("markerFound", () => {
                isMarkerFound = true;
                scanOverlay.style.opacity = '0';

                if (!isModelLoaded) {
                    loadingSpinner.style.display = 'flex';
                } else {
                    loadingSpinner.style.display = 'none';
                }
            });

            marker.addEventListener("markerLost", () => {
                isMarkerFound = false;
                scanOverlay.style.opacity = '1';
                loadingSpinner.style.display = 'none';
            });

            document.getElementById('capture-btn').addEventListener('click', () => {
                const video = document.querySelector('video');
                const canvas = document.querySelector('canvas.a-canvas');

                if (!video || !canvas) return;

                const mergedCanvas = document.createElement('canvas');
                mergedCanvas.width = canvas.width;
                mergedCanvas.height = canvas.height;
                const ctx = mergedCanvas.getContext('2d');

                ctx.drawImage(video, 0, 0, mergedCanvas.width, mergedCanvas.height);
                ctx.drawImage(canvas, 0, 0, mergedCanvas.width, mergedCanvas.height);

                const link = document.createElement('a');
                link.download = `Blackcat_AR_${Date.now()}.png`;
                link.href = mergedCanvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
