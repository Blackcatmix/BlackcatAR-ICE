<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackcat WebAR Experience - 3TECHLAB</title>

    <!-- Librerías estables para iOS y Android (A-Frame + MindAR) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
        }

        /* Ocultar elementos sobrantes */
        .a-enter-vr {
            display: none !important;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            margin-top: 10px;
        }

        .controls-container {
            pointer-events: auto;
            margin-bottom: 25px;
        }

        .btn-capture {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        #scanning-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.85);
            padding: 12px 24px;
            border-radius: 12px;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="brand-header">BLACKCAT • BEBIDAS & COCKTAILS</div>
        <div id="scanning-overlay">Apunta la cámara al hielo o vaso...</div>
        <div class="controls-container">
            <button id="capture-btn" class="btn-capture">📷 Capturar Momento</button>
        </div>
    </div>

    <!-- Escena AR nativa para WebAR -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: #scanning-overlay; filterMinCF: 0.0001; filterBeta: 0.001;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="catModel" src="./cat_model.glb"></a-asset-item>
            <img id="logoImg" src="./blackcat_logo.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Iluminación ambiente de bar -->
        <a-light type="ambient" color="#fff5ea" intensity="1.2"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.0" position="2 4 2"></a-light>

        <!-- Anchor del Target -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Logo 3D vertical de fondo -->
            <a-plane src="#logoImg" position="0 0.8 -0.3" height="0.6" width="1.2" material="transparent: true; side: double"></a-plane>
            
            <!-- Modelo 3D del Gato -->
            <a-gltf-model src="#catModel" position="0 0.1 0" scale="0.1 0.1 0.1" animation-mixer></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sceneEl = document.querySelector('a-scene');
            const scanOverlay = document.getElementById('scanning-overlay');

            sceneEl.addEventListener("targetFound", () => {
                scanOverlay.style.opacity = '0';
            });

            sceneEl.addEventListener("targetLost", () => {
                scanOverlay.style.opacity = '1';
            });

            // Capturar pantalla
            document.getElementById('capture-btn').addEventListener('click', () => {
                const video = document.querySelector('video');
                const canvas = document.querySelector('canvas.a-canvas');

                if (!video || !canvas) return;

                const mergedCanvas = document.createElement('canvas');
                mergedCanvas.width = canvas.width;
                mergedCanvas.height = canvas.height;
                const ctx = mergedCanvas.getContext('2d');

                ctx.drawImage(video, 0, 0, mergedCanvas.width, mergedCanvas.height);
                ctx.drawImage(canvas, 0, 0, mergedCanvas.width, mergedCanvas.height);

                const link = document.createElement('a');
                link.download = `Blackcat_AR_${Date.now()}.png`;
                link.href = mergedCanvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
