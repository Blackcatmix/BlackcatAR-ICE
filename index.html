<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackcat WebAR Experience - 3TECHLAB</title>

    <!-- CDNs de Three.js y MindAR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
        }

        #ar-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Pantalla de inicio para desbloquear permisos de cámara en iOS Safari */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 99;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .start-title {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .start-subtitle {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .btn-start {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            margin-top: 10px;
        }

        .controls-container {
            pointer-events: auto;
            margin-bottom: 25px;
        }

        .btn-capture {
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        #scanning-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.8);
            padding: 12px 24px;
            border-radius: 12px;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

    <!-- Pantalla de inicio para compatibilidad con iOS -->
    <div id="start-overlay">
        <div class="start-title">BLACKCAT</div>
        <div class="start-subtitle">BEBIDAS & COCKTAILS</div>
        <button id="start-btn" class="btn-start">Iniciar Experiencia AR</button>
    </div>

    <div id="ar-container"></div>

    <div id="ui-overlay">
        <div class="brand-header">BLACKCAT • BEBIDAS & COCKTAILS</div>
        <div id="scanning-overlay">Apunta la cámara al hielo o vaso...</div>
        <div class="controls-container">
            <button id="capture-btn" class="btn-capture">📷 Capturar Momento</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const CONFIG = {
                targetMindUrl: './targets.mind',
                catModelUrl: './cat_model.glb',
                logoImageUrl: './blackcat_logo.png'
            };

            let mindarThree = null;
            let mixer = null;
            let clock = new THREE.Clock();

            const startBtn = document.getElementById('start-btn');
            const startOverlay = document.getElementById('start-overlay');

            startBtn.addEventListener('click', async () => {
                startOverlay.style.display = 'none';
                await initAR();
            });

            const initAR = async () => {
                try {
                    mindarThree = new window.MINDAR.IMAGE.MindARThree({
                        container: document.querySelector("#ar-container"),
                        imageTargetSrc: CONFIG.targetMindUrl,
                        uiScanning: 'no',
                        filterMinCF: 0.0001,
                        filterBeta: 0.001
                    });

                    const { renderer, scene, camera } = mindarThree;

                    renderer.toneMapping = THREE.ACESFilmicToneMapping;
                    renderer.toneMappingExposure = 1.2;

                    const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.2);
                    scene.add(ambientLight);

                    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
                    dirLight.position.set(2, 4, 2);
                    scene.add(dirLight);

                    const anchor = mindarThree.addAnchor(0);
                    const arGroup = new THREE.Group();
                    arGroup.scale.set(0, 0, 0);
                    anchor.group.add(arGroup);

                    // Carga del Logo
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(CONFIG.logoImageUrl, (texture) => {
                        const logoGeo = new THREE.PlaneGeometry(1.2, 0.6);
                        const logoMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                        const logoMesh = new THREE.Mesh(logoGeo, logoMat);
                        logoMesh.position.set(0, 0.8, -0.3);
                        arGroup.add(logoMesh);
                    });

                    // Carga del Modelo GLB
                    const gltfLoader = new THREE.GLTFLoader();
                    gltfLoader.load(CONFIG.catModelUrl, (gltf) => {
                        const catNode = gltf.scene;
                        catNode.scale.set(0.1, 0.1, 0.1);
                        catNode.position.set(0, 0.1, 0);

                        if (gltf.animations && gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(catNode);
                            gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                        }

                        arGroup.add(catNode);
                    });

                    const scanOverlay = document.getElementById('scanning-overlay');

                    anchor.onTargetFound = () => {
                        scanOverlay.style.opacity = '0';
                        arGroup.scale.set(1, 1, 1);
                    };

                    anchor.onTargetLost = () => {
                        scanOverlay.style.opacity = '1';
                        arGroup.scale.set(0, 0, 0);
                    };

                    // Inicializar motor AR y forzar atributos de video para iOS Safari
                    await mindarThree.start();

                    const video = document.querySelector("#ar-container video");
                    if (video) {
                        video.setAttribute("playsinline", "");
                        video.setAttribute("webkit-playsinline", "");
                        await video.play();
                    }

                    renderer.setAnimationLoop(() => {
                        const delta = clock.getDelta();
                        if (mixer) mixer.update(delta);
                        renderer.render(scene, camera);
                    });

                } catch (error) {
                    alert("Error al acceder a la cámara. Asegúrate de dar permisos de cámara en tu navegador.");
                    console.error("AR Init Error:", error);
                }
            };

            // Capturar pantalla
            document.getElementById('capture-btn').addEventListener('click', () => {
                const video = document.querySelector('video');
                const arCanvas = document.querySelector('#ar-container canvas');

                if (!video || !arCanvas) return;

                const mergedCanvas = document.createElement('canvas');
                mergedCanvas.width = arCanvas.width;
                mergedCanvas.height = arCanvas.height;
                const ctx = mergedCanvas.getContext('2d');

                ctx.drawImage(video, 0, 0, mergedCanvas.width, mergedCanvas.height);
                ctx.drawImage(arCanvas, 0, 0, mergedCanvas.width, mergedCanvas.height);

                const link = document.createElement('a');
                link.download = `Blackcat_AR_${Date.now()}.png`;
                link.href = mergedCanvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
